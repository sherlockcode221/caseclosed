<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hospital Shift</title>
<!--
  Hospital Shift: a study game for medical students. Single file, no build step.
  Add a ward: add an object to the WARDS array with {n, d, c:[lightAccent, darkAccent], C, L}.
  In every question the FIRST option is the correct one; the game shuffles them.
-->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF0F2;--ink:#17303B;--card:#fff;--line:#C5D2D8;--teal:#167A78;--bad:#B93A36;--ok:#1E7A45;--mute:#58737F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#10202A;--ink:#E3EEF2;--card:#19303C;--line:#2B4553;--bad:#F07A74;--ok:#6CCB92;--mute:#93AEBA}.btn{color:#10201A!important}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:30px;font-weight:800;line-height:1.1;margin:8px 0 4px}h2{font-size:21px;margin:4px 0 8px}
p{margin:6px 0}.mute{color:var(--mute);font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.rep{font-weight:800;color:var(--teal)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:600;width:100%;margin-top:10px}
.btn:disabled{opacity:.4;cursor:default}.ghost{background:none!important;color:var(--ink)!important;border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.case{display:flex;justify-content:space-between;width:100%;text-align:left;align-items:center;gap:8px}
.ward{border-left:6px solid var(--c)}
.ord{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.ord button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;font-size:14px}
.ord button.u{border-color:var(--teal);background:none;color:var(--teal)}.ord button:disabled:not(.u){opacity:.4}
.find{border-left:4px solid var(--teal);background:var(--card);padding:8px 12px;margin:8px 0;border-radius:0 10px 10px 0}
.find b{display:block;font-size:13px;color:var(--teal)}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:7px 0}
.opt.s{border:2px solid var(--teal);padding:10px 11px}.opt.ok{border:2px solid var(--ok)}.opt.no{border:2px solid var(--bad)}
.tag{font-weight:800}.good{color:var(--ok)}.badc{color:var(--bad)}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:7px 0}
summary{font-weight:600;cursor:pointer}details p{font-size:15px}
</style></head><body><div id="app"></div>

{n:'Neuro Ward 1',d:'White matter, basal nuclei, internal capsule',c:['#167A78','#4DBFB8'],F:[["Three types of white matter fibres?", "Association (same hemisphere), commissural (between hemispheres), projection (cortex to lower centres and back)."], ["Corpus callosum: size and parts?", "About 10 cm, 100 million fibres, C-shaped. Rostrum, genu, body (trunk), splenium."], ["Which part of the corpus callosum forms the forceps minor? The forceps major and tapetum?", "Genu forms the forceps minor. Splenium forms the forceps major and tapetum."], ["Uncinate fasciculus connects?", "Orbital gyri of the frontal lobe to the temporal pole (long association fibre)."], ["Arcuate fasciculus?", "Short association fibre hooking around the sulcus; in the dominant hemisphere it links the two language areas."], ["Shape and parts of the internal capsule?", "V-shaped projection bundle: anterior limb, genu, posterior limb, plus sublentiform and retrolentiform parts."], ["Anterior limb: boundaries and fibres?", "Between head of caudate and lentiform nucleus. Frontopontine fibres + anterior thalamic radiation."], ["Genu: fibres and blood supply?", "Corticobulbar (corticonuclear) fibres. Recurrent artery of Heubner or direct branches of the ICA."], ["Posterior limb: fibres?", "Corticospinal, superior thalamic radiation (sensory), corticorubral, parieto-pontine."], ["Retrolentiform part carries?", "Optic radiation + parieto-occipito-pontine fibres."], ["Sublentiform part carries?", "Auditory radiation + temporopontine fibres."], ["Artery of cerebral haemorrhage?", "Lateral striate branch of the middle cerebral artery (Charcot's artery)."], ["Internal capsule lesion gives?", "Contralateral hemiplegia including the face, plus contralateral loss of all somatic sensation."], ["Lentiform nucleus vs striatum?", "Lentiform = putamen + globus pallidus. Striatum = caudate + putamen."], ["Which part of the corpus striatum is efferent?", "Globus pallidus (the striatum receives)."], ["Corpus striatum damage signs?", "Rigidity, loss of associated movements, resting tremor, no paralysis."], ["Chorea, athetosis, hemiballismus?", "Chorea: jerky, irregular. Athetosis: slow writhing, distal. Hemiballismus: violent flinging of one side."]],...(()=>{const C=[
{n:"Mr. Hamdy, 62",c:"Collapsed mid-argument. Severe headache, vomiting, then could not move his left side.",
o:[["History","Hypertensive for years, poorly treated. BP now 220/120. Headache came first, then collapse."],

{n:"Mrs. Nadia, 58",c:"Two days of 'missing things' on her right. Bumps into door frames. No headache, no fall.",

q1:["Where is the lesion?",["Left retrolentiform part of the internal capsule","Left sublentiform part of the internal capsule","Left posterior limb of the internal capsule","Left genu of the internal capsule","Right retrolentiform part of the internal capsule","Left anterior limb of the internal capsule"]],
q2:["Which fibres carry the lost function through this part?",["Optic radiation (with parieto-occipito-pontine fibres)","Auditory radiation (with temporo-pontine fibres)","Superior thalamic (sensory) radiation","Corticobulbar fibres","Frontopontine fibres"]],

{n:"Mr. Farouk, 70",c:"His wife says his face has gone blank and he no longer swings his arms when he walks.",
o:[["History","Months of slowly worsening stiffness. Handwriting getting smaller."],

["Corpus callosum","About 10 cm, 100 million fibres, C-shaped, roof of lateral ventricle. Rostrum (floor of anterior horns), genu (forceps minor), body, splenium (thickest: tapetum + forceps major)."],
["Other commissures","Anterior: olfactory bulbs, anterior perforated substance, piriform lobes, amygdaloid bodies. Posterior: pretectal nuclei. Habenular: habenular nuclei. Hippocampal: between fornix crura."],
["Internal capsule","V-shaped bundle of projection fibres, continuous with corona radiata above and crus cerebri below. Anterior limb (between caudate head and lentiform): frontopontine + anterior thalamic radiation. Genu: corticobulbar. Posterior limb (thalamus to lentiform): corticospinal, superior thalamic radiation, corticorubral, parieto-pontine. Sublentiform: auditory radiation + temporopontine. Retrolentiform: optic radiation + parieto-occipito-pontine."],
["Arterial supply","Striate arteries from MCA and ACA. Anterior limb: medial striate (ACA) + lateral striate (MCA). Genu: recurrent artery of Heubner or ICA branches. Posterior limb: lateral striate (MCA) + anterior choroidal. Charcot's artery = a lateral striate branch of the MCA."],

{n:'Neuro Ward 2',d:'Cortex, ventricles, spinal cord, brainstem, cerebellum',c:['#2E7D4F','#6CCB92'],F:[["Brodmann areas: frontal lobe?", "4 primary motor, 6 premotor, 8 frontal eye field, 44/45 Broca."], ["Brodmann areas: parietal and temporal?", "3, 1, 2 primary somatosensory; 5, 7 association; 41/42 primary auditory; 22 Wernicke."], ["Primary visual cortex?", "Area 17, walls of the calcarine sulcus."], ["Broca vs Wernicke aphasia?", "Broca: non-fluent, telegraphic, comprehension intact. Wernicke: fluent, neologisms, no comprehension."], ["Right parietal lesion causes?", "Contralateral (left) hemineglect: Areas 5 and 7, non-dominant hemisphere."], ["CSF pathway in order?", "Lateral ventricles, foramen of Monro, 3rd ventricle, aqueduct of Sylvius, 4th ventricle, Luschka and Magendie, subarachnoid space."], ["Where is CSF absorbed?", "Arachnoid granulations into the superior sagittal sinus."], ["Aqueductal stenosis?", "Dilated lateral and 3rd ventricles, normal 4th: non-communicating hydrocephalus."], ["Hydrocephalus after subarachnoid bleed?", "Arachnoid granulation fibrosis: impaired absorption (communicating)."], ["Low CSF pressure headache?", "Positional, worse upright, better lying flat. CSF leak."], ["Dorsal column vs spinothalamic?", "Dorsal: fine touch, proprioception, vibration (uncrossed). Spinothalamic: pain and temperature (crosses in the anterior white commissure)."], ["Brown-S\u00e9quard syndrome?", "Ipsilateral motor and dorsal column loss, contralateral pain and temperature loss."], ["Syringomyelia?", "Cape-like loss of pain and temperature, fine touch preserved. Central cavity hits the anterior white commissure."], ["Subacute combined degeneration (B12)?", "Dorsal and lateral columns: vibration loss, spastic paraparesis, Babinski."], ["Wallenberg syndrome?", "PICA, lateral medulla: ipsilateral Horner, facial pain loss, ataxia; contralateral body pain loss."], ["Weber syndrome?", "Ventral midbrain (crus cerebri): ipsilateral CN III palsy + contralate A.innerHTML=`<div class=bar><button class="btn ghost" style="width:auto;margin:0" onclick="home()">Leave</button><span class=mute>Left: <b>${D.length}</b> | Known: <b>${K}</b></span></div>
<button class=card style="width:100%;min-height:230px;text-align:center;font-size:${fl?17:20}px;border:2px solid var(--teal);display:flex;align-items:center;justify-content:center" onclick="fl=!fl;showFC()">${fl?c[1]:'<b>'+c[0]+'</b>'}</button>
<p class=mute style="text-align:center">${fl?'Answer':'Tap the card to flip'}</p>`+
(fl?`<button class=btn onclick="kn(1)">I knew it</button><button class="btn ghost" onclick="kn(0)">Again later</button>`:'')}
function kn(ok){const i=D.shift();if(ok)K++;else D.push(i);fl=false;showFC()}
function open_(i){G={i,u:[],s:1,sel:null,a1:null,a2:null,h:0,o1:mk(C[i].q1),o2:mk(C[i].q2)};view()}
function ord(k){if(G.s>2||G.u.includes(k)||G.u.length>=4)return;G.u.push(k);view()}
function hint(){G.h++;view()}
function pick(k){G.sel=k;view()}
function lock(){G['a'+G.s]=G.sel;G.sel=null;if(G.s==1){G.s=2;view()}else{G.s=3;fin()}}
function view(){const c=C[G.i],left=4-G.u.length;
let h=`<div class=bar><button class="btn ghost" style="width:auto;margin:0" onclick="home()">Leave</button><span class=mute>Tests left: <b>${left}</b></span></div><h2>${c.n}</h2><p>${c.c}</p>`;
h+=`<div class=ord>`+c.o.map((o,k)=>`<button class="${G.u.includes(k)?'u':''}" ${G.s>1||(!G.u.includes(k)&&!left)?'disabled':''} onclick="ord(${k})">${o[0]}</button>`).join('')+`</div>`;
h+=G.u.map(k=>`<div class=find><b>${c.o[k][0]}</b>${c.o[k][1]}</div>`).join('');
if(G.h)h+=`<div class=find><b>Attending (-10 reputation)</b>${c.h}</div>`;
if(G.s==1)h+=`<button class="btn ghost" onclick="hint()" ${G.h?'disabled':''}>Ask the attending for a hint (-10)</button>`;
const q=G.s==1?c.q1:c.q2,os=G.s==1?G.o1:G.o2;
h+=`<h2 style="margin-top:18px">${G.s==1?'Diagnosis: ':'Follow-up: '}${q[0]}</h2>`+os.map((o,k)=>`<button class="opt ${G.sel===k?'s':''}" onclick="pick(${k})">${o[0]}</button>`).join('')+`<button class=btn ${G.sel==null?'disabled':''} onclick="lock()">Lock in answer (final)</button>`;
A.innerHTML=h}
function fin(){const c=C[G.i],k1=G.o1[G.a1][1],k2=G.o2[G.a2][1],left=4-G.u.length;
let s=(k1?40:0)+(k2?40:0)+(k1?left*5:0)-G.h*10;s=Math.max(0,s);
if(bs(w,G.i)==null||s>bs(w,G.i)){best[w+':'+G.i]=s;save()}
const rv=(os,a)=>os.map((o,k)=>`<div class="opt ${o[1]?'ok':k==a?'no':''}" style="${o[1]||k==a?'':'opacity:.55'}">${o[0]}${o[1]?' &#10003;':k==a?' &#10007; your answer':''}</div>`).join('');
const miss=c.o.map((o,k)=>G.u.includes(k)?'':`<div class=find><b>${o[0]} (not ordered)</b>${o[1]}</div>`).join('');
A.innerHTML=`<h1>${s} / 100</h1><p class="tag ${k1&&k2?'good':'badc'}">${k1&&k2?'Case solved.':k1?'Right diagnosis, wrong follow-up.':'Missed diagnosis.'}</p>
<h2>Diagnosis</h2>${rv(G.o1,G.a1)}<h2>Follow-up</h2>${rv(G.o2,G.a2)}
<div class=card><b>Case file</b><p>${c.f}</p></div>${miss?'<h2>What you skipped</h2>'+miss:''}
<button class=btn onclick="open_(${G.i})">Replay this case</button><button class="btn ghost" onclick="home()">Back to the ward</button>`}
menu();
</script></body></html>
