<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSS 201 - Neuroanatomy Study & Clinical Hub</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-light: #eff6ff;
            --border-color: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        sidebar {
            width: 280px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 10;
        }

        .brand {
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand i {
            font-size: 24px;
            color: var(--accent-color);
        }

        .brand h2 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .nav-menu {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-item:hover, .nav-item.active {
            background-color: var(--accent-light);
            color: var(--accent-color);
        }

        /* Main Content Container */
        main {
            margin-left: 280px;
            flex-grow: 1;
            padding: 32px;
            max-width: 1200px;
        }

        header {
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
        }

        header p {
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Lecture Selector Tabs */
        .lecture-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 8px 16px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: var(--radius-md);
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: white;
        }

        /* View Mode Switcher (Theory / Cases / Flashcards) */
        .view-switcher {
            display: flex;
            gap: 8px;
            background-color: #e2e8f0;
            padding: 4px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            width: fit-content;
        }

        .view-btn {
            padding: 6px 16px;
            border: none;
            background: none;
            border-radius: 6px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .view-btn.active {
            background: var(--bg-card);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
        }

        /* Content Display Cards */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .badge {
            background-color: var(--accent-light);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Case Box Styling */
        .case-box {
            background-color: #f1f5f9;
            border-left: 4px solid var(--accent-color);
            padding: 16px;
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            margin-bottom: 16px;
        }

        .case-title {
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Multiple Choice Options */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .option-btn {
            text-align: left;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-btn:hover {
            border-color: var(--accent-color);
            background-color: var(--accent-light);
        }

        .option-btn.correct {
            border-color: var(--success);
            background-color: #dcfce7;
            color: #15803d;
        }

        .option-btn.incorrect {
            border-color: var(--danger);
            background-color: #fee2e2;
            color: #b91c1c;
        }

        .explanation {
            margin-top: 12px;
            padding: 12px;
            background-color: #fffbe3;
            border: 1px solid #fde047;
            border-radius: var(--radius-md);
            font-size: 13px;
            display: none;
        }

        /* Flashcard Feature */
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 250px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            border-radius: var(--radius-lg);
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: var(--accent-light);
            color: var(--accent-color);
        }

        /* Responsive Layout */
        @media (max-width: 768px) {
            sidebar {
                width: 70px;
            }
            sidebar .brand h2, sidebar .nav-item span {
                display: none;
            }
            main {
                margin-left: 70px;
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <sidebar>
        <div class="brand">
            <i class="fa-solid fa-brain"></i>
            <h2>NSS 201 Hub</h2>
        </div>
        <div class="nav-menu">
            <div class="nav-item active" onclick="switchView('study')">
                <i class="fa-solid fa-book-open"></i>
                <span>Lecture Hub</span>
            </div>
            <div class="nav-item" onclick="switchView('cases')">
                <i class="fa-solid fa-user-doctor"></i>
                <span>Clinical Cases</span>
            </div>
            <div class="nav-item" onclick="switchView('flashcards')">
                <i class="fa-solid fa-layer-group"></i>
                <span>Flashcards</span>
            </div>
        </div>
    </sidebar>

    <!-- Main Content Body -->
    <main>
        <header>
            <div>
                <h1>Neuro-Spinal-System (NSS 201)</h1>
                <p>Interactive medical study hub, clinical case resolver, and lecture overview.</p>
            </div>
            <span class="badge"><i class="fa-solid fa-sun"></i> Light Theme</span>
        </header>

        <!-- Lecture Selection -->
        <div class="lecture-tabs">
            <button class="tab-btn active" onclick="selectLecture('lec1')">L1: Cerebrum White Matter</button>
            <button class="tab-btn" onclick="selectLecture('lec2')">L2: Basal Ganglia</button>
            <button class="tab-btn" onclick="selectLecture('lec3')">L3: Internal Capsule</button>
        </div>

        <!-- View Mode Switcher -->
        <div class="view-switcher">
            <button class="view-btn active" id="btn-summary" onclick="setMode('summary')">Summary & Notes</button>
            <button class="view-btn" id="btn-cases" onclick="setMode('cases')">Clinical Cases</button>
            <button class="view-btn" id="btn-cards" onclick="setMode('cards')">Flashcards</button>
        </div>

        <!-- Dynamic Content Display Area -->
        <div id="content-area"></div>
    </main>

    <script>
        // Lecture Content Data (Extracted from NSS 201 curriculum)
        const nssData = {
            lec1: {
                title: "White Matter of the Cerebrum",
                summary: [
                    "<b>Association Fibers:</b> Interconnect different cortical regions within the same hemisphere. Includes short arcuate fibers (adjacent gyri) and long association fibers (e.g., Uncinate Fasciculus, Cingulum, Superior & Inferior Longitudinal Fasciculi).",
                    "<b>Commissural Fibers:</b> Connect corresponding areas of the left and right hemispheres. Corpus Callosum is the largest commissure (100 million fibers), consisting of Rostrum, Genu, Body, and Splenium. Others include Anterior, Posterior, Habenular, and Hippocampal commissures.",
                    "<b>Projection Fibers:</b> Connect the cerebral cortex to lower centers (brainstem and spinal cord). Examples include Corticospinal and Corticobulbar tracts passing through the Internal Capsule."
                ],
                cases: [
                    {
                        title: "Case 1: Conduction Aphasia",
                        scenario: "A 58-year-old patient presents with fluid speech and normal comprehension, but severe difficulty repeating words spoken by the physician. Imaging shows a stroke damaging a specific long association bundle connecting Broca's and Wernicke's areas.",
                        options: [
                            { text: "Uncinate Fasciculus", correct: false },
                            { text: "Arcuate Fasciculus (Superior Longitudinal)", correct: true },
                            { text: "Corpus Callosum", correct: false },
                            { text: "Anterior Commissure", correct: false }
                        ],
                        explanation: "The Arcuate Fasciculus connects Wernicke's (language comprehension) with Broca's area (motor speech). Disruption leads to Conduction Aphasia (impaired repetition with preserved comprehension)."
                    },
                    {
                        title: "Case 2: Alexia without Agraphia (Disconnection Syndrome)",
                        scenario: "A patient suffers an ischemic stroke involving the left Posterior Cerebral Artery (PCA), damaging the posterior portion of the Corpus Callosum. The patient can write sentences normally but is completely unable to read what they just wrote.",
                        options: [
                            { text: "Genu of Corpus Callosum", correct: false },
                            { text: "Rostrum of Corpus Callosum", correct: false },
                            { text: "Splenium of Corpus Callosum", correct: true },
                            { text: "Anterior Commissure", correct: false }
                        ],
                        explanation: "The Splenium transfers visual information from the right visual cortex across the midline to the left hemisphere language center. Damage causes Alexia without Agraphia."
                    }
                ],
                cards: [
                    { front: "What connects adjacent gyri in the same hemisphere?", back: "Short Association Fibers (Arcuate Fibers)." },
                    { front: "Which structure is the largest commissure of the brain?", back: "Corpus Callosum (~100 million fibers)." },
                    { front: "Which fibers connect the cerebral cortex to lower spinal levels?", back: "Projection Fibers." }
                ]
            },
            lec2: {
                title: "Basal Ganglia & Subcortical Nuclei",
                summary: [
                    "<b>Basal Ganglia Components:</b> Caudate Nucleus, Putamen, Globus Pallidus (Striatum = Caudate + Putamen).",
                    "<b>Functional Role:</b> Regulation of voluntary motor control, procedural learning, and movement initiation.",
                    "<b>Direct vs. Indirect Pathway:</b> Direct pathway promotes movement; indirect pathway inhibits unwanted movement."
                ],
                cases: [
                    {
                        title: "Case 1: Resting Tremor & Rigidity",
                        scenario: "A 65-year-old male presents with a pill-rolling resting tremor, cogwheel rigidity, and bradykinesia. Degeneration of dopaminergic neurons in a specific subcortical structure is noted.",
                        options: [
                            { text: "Substantia Nigra Pars Compacta", correct: true },
                            { text: "Caudate Nucleus", correct: false },
                            { text: "Subthalamic Nucleus", correct: false },
                            { text: "Globus Pallidus Internus", correct: false }
                        ],
                        explanation: "Parkinson's Disease is characterized by the loss of dopaminergic neurons in the Substantia Nigra Pars Compacta, disrupting basal ganglia motor output circuits."
                    },
                    {
                        title: "Case 2: Sudden Hemiballismus",
                        scenario: "A patient develops sudden, involuntary, violent flinging movements of the right upper and lower limbs following a stroke. Where is the lesion?",
                        options: [
                            { text: "Left Subthalamic Nucleus", correct: true },
                            { text: "Right Caudate Nucleus", correct: false },
                            { text: "Left Putamen", correct: false },
                            { text: "Corpus Callosum", correct: false }
                        ],
                        explanation: "Lesions of the contralateral Subthalamic Nucleus reduce excitation of Globus Pallidus, releasing thalamocortical drive and leading to Hemiballismus."
                    }
                ],
                cards: [
                    { front: "What constitutes the Striatum?", back: "Caudate Nucleus and Putamen." },
                    { front: "What movement disorder results from Subthalamic Nucleus lesion?", back: "Contralateral Hemiballismus." }
                ]
            },
            lec3: {
                title: "The Internal Capsule",
                summary: [
                    "<b>Anatomy:</b> V-shaped band of white matter separated into Anterior Limb, Genu, and Posterior Limb.",
                    "<b>Anterior Limb:</b> Contains Frontopontine and Anterior Thalamic radiation.",
                    "<b>Genu:</b> Contains Corticobulbar tract (innervates cranial nerve nuclei).",
                    "<b>Posterior Limb:</b> Contains Corticospinal tract (motor output to limbs) and Sensory Radiations."
                ],
                cases: [
                    {
                        title: "Case 1: Pure Motor Hemiplegia",
                        scenario: "A 62-year-old hypertensive patient presents with sudden right-sided dense hemiplegia involving equal severity in the face, arm, and leg. Sensory testing is normal.",
                        options: [
                            { text: "Posterior Limb & Genu of Internal Capsule", correct: true },
                            { text: "Anterior Limb of Internal Capsule", correct: false },
                            { text: "Uncinate Fasciculus", correct: false },
                            { text: "Subthalamic Nucleus", correct: false }
                        ],
                        explanation: "Lacunar strokes affecting the posterior limb (Corticospinal fibers) and genu (Corticobulbar fibers) cause pure motor hemiplegia."
                    }
                ],
                cards: [
                    { front: "Which part of the internal capsule contains Corticobulbar fibers?", back: "The Genu." },
                    { front: "Which part carries the main Corticospinal tract?", back: "The Posterior Limb." }
                ]
            }
        };

        let currentLec = 'lec1';
        let currentMode = 'summary';

        function selectLecture(lecKey) {
            currentLec = lecKey;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            render();
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
            render();
        }

        function switchView(view) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');
            if (view === 'study') setMode('summary');
            if (view === 'cases') setMode('cases');
            if (view === 'flashcards') setMode('cards');
        }

        function checkAnswer(btn, isCorrect, expText) {
            const parent = btn.parentElement;
            const buttons = parent.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);
            
            if (isCorrect) {
                btn.classList.add('correct');
            } else {
                btn.classList.add('incorrect');
            }

            const expBox = parent.parentElement.querySelector('.explanation');
            expBox.style.display = 'block';
        }

        function render() {
            const container = document.getElementById('content-area');
            const data = nssData[currentLec];

            if (currentMode === 'summary') {
                container.innerHTML = `
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">${data.title} - Overview</span>
                            <span class="badge">Theory</span>
                        </div>
                        <ul style="padding-left: 20px; line-height: 1.8;">
                            ${data.summary.map(item => `<li style="margin-bottom: 12px;">${item}</li>`).join('')}
                        </ul>
                    </div>
                `;
            } else if (currentMode === 'cases') {
                container.innerHTML = data.cases.map((c, i) => `
                    <div class="card">
                        <div class="case-box">
                            <div class="case-title"><i class="fa-solid fa-stethoscope"></i> ${c.title}</div>
                            <p style="font-size: 14px; color: var(--text-secondary);">${c.scenario}</p>
                        </div>
                        <div class="options-list">
                            ${c.options.map(opt => `
                                <button class="option-btn" onclick="checkAnswer(this, ${opt.correct})">
                                    ${opt.text}
                                    <i class="fa-regular fa-circle"></i>
                                </button>
                            `).join('')}
                        </div>
                        <div class="explanation">
                            <b>Explanation:</b> ${c.explanation}
                        </div>
                    </div>
                `).join('');
            } else if (currentMode === 'cards') {
                container.innerHTML = `
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
                        ${data.cards.map(card => `
                            <div class="flashcard-container" onclick="this.querySelector('.flashcard').classList.toggle('flipped')">
                                <div class="flashcard">
                                    <div class="card-front">
                                        <p style="font-weight:600;">${card.front}</p>
                                        <span style="font-size:12px; color: var(--text-muted); margin-top:16px;">Click to flip</span>
                                    </div>
                                    <div class="card-back">
                                        <p style="font-weight:600;">${card.back}</p>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        }

        // Initial Load
        render();
    </script>
</body>
</html>
