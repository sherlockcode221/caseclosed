<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSS 201 - Complete Neuroanatomy Clinical Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-light: #eff6ff;
            --border-color: #e2e8f0;
            --success: #10b981;
            --success-bg: #dcfce7;
            --danger: #ef4444;
            --danger-bg: #fee2e2;
            --warning-bg: #fef9c3;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-primary); display: flex; min-height: 100vh; }

        sidebar {
            width: 280px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 10;
        }

        .brand { padding: 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-color); }
        .brand i { font-size: 24px; color: var(--accent-color); }
        .brand h2 { font-size: 18px; font-weight: 700; }

        .nav-menu { padding: 16px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            border-radius: var(--radius-md); color: var(--text-secondary);
            font-weight: 500; cursor: pointer; transition: all 0.2s ease;
        }
        .nav-item:hover, .nav-item.active { background-color: var(--accent-light); color: var(--accent-color); }

        main { margin-left: 280px; flex-grow: 1; padding: 32px; max-width: 1200px; }

        header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 26px; font-weight: 700; }
        header p { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }

        .lecture-nav {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px;
            margin-bottom: 20px; border-bottom: 2px solid var(--border-color);
        }

        .lec-btn {
            white-space: nowrap; background: var(--bg-card); border: 1px solid var(--border-color);
            padding: 10px 16px; font-size: 13px; font-weight: 600; color: var(--text-secondary);
            cursor: pointer; border-radius: var(--radius-md); transition: all 0.2s ease;
        }
        .lec-btn.active { background-color: var(--accent-color); color: white; border-color: var(--accent-color); }

        .view-switcher {
            display: flex; gap: 8px; background-color: #e2e8f0; padding: 4px;
            border-radius: var(--radius-md); margin-bottom: 24px; width: fit-content;
        }

        .view-btn {
            padding: 8px 18px; border: none; background: none; border-radius: 6px;
            font-weight: 600; font-size: 13px; color: var(--text-secondary); cursor: pointer;
        }
        .view-btn.active { background: var(--bg-card); color: var(--text-primary); box-shadow: var(--shadow-sm); }

        .card {
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px; box-shadow: var(--shadow-sm);
        }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        .card-title { font-size: 18px; font-weight: 700; }
        .badge { background-color: var(--accent-light); color: var(--accent-color); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }

        .case-box { background-color: #f1f5f9; border-left: 4px solid var(--accent-color); padding: 16px; border-radius: 0 var(--radius-md) var(--radius-md) 0; margin-bottom: 16px; }
        .case-title { font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }

        .options-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
        .option-btn {
            text-align: left; padding: 12px 16px; border: 1px solid var(--border-color);
            background: var(--bg-card); border-radius: var(--radius-md); cursor: pointer;
            font-size: 14px; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center;
        }
        .option-btn:hover { border-color: var(--accent-color); background-color: var(--accent-light); }
        .option-btn.correct { border-color: var(--success); background-color: var(--success-bg); color: #15803d; font-weight: 600; }
        .option-btn.incorrect { border-color: var(--danger); background-color: var(--danger-bg); color: #b91c1c; font-weight: 600; }

        .explanation { margin-top: 14px; padding: 14px; background-color: var(--warning-bg); border: 1px solid #fde047; border-radius: var(--radius-md); font-size: 13.5px; line-height: 1.6; display: none; }

        .flashcard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .flashcard-container { perspective: 1000px; height: 220px; cursor: pointer; }
        .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.5s ease; border-radius: var(--radius-lg); }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; border-radius: var(--radius-lg); background-color: var(--bg-card);
            border: 1px solid var(--border-color); text-align: center;
        }
        .card-back { transform: rotateY(180deg); background-color: var(--accent-light); color: var(--accent-color); }

        @media (max-width: 768px) {
            sidebar { width: 70px; }
            sidebar .brand h2, sidebar .nav-item span { display: none; }
            main { margin-left: 70px; padding: 16px; }
        }
    </style>
</head>
<body>

    <sidebar>
        <div class="brand">
            <i class="fa-solid fa-brain"></i>
            <h2>NSS 201 Complete</h2>
        </div>
        <div class="nav-menu">
            <div class="nav-item active" onclick="switchView('study')">
                <i class="fa-solid fa-book-open"></i>
                <span>Summaries</span>
            </div>
            <div class="nav-item" onclick="switchView('cases')">
                <i class="fa-solid fa-user-doctor"></i>
                <span>Clinical Cases</span>
            </div>
            <div class="nav-item" onclick="switchView('flashcards')">
                <i class="fa-solid fa-layer-group"></i>
                <span>Flashcards</span>
            </div>
        </div>
    </sidebar>

    <main>
        <header>
            <div>
                <h1>NSS 201: All 8 Lectures Hub</h1>
                <p>Expanded coverage: Every single lecture with high-yield clinical cases and active recall tools.</p>
            </div>
            <span class="badge"><i class="fa-solid fa-sun"></i> Light Theme</span>
        </header>

        <!-- All 8 Lectures Selector Bar -->
        <div class="lecture-nav">
            <button class="lec-btn active" onclick="selectLec('lec1')">L1: White Matter</button>
            <button class="lec-btn" onclick="selectLec('lec2')">L2: Basal Ganglia</button>
            <button class="lec-btn" onclick="selectLec('lec3')">L3: Internal Capsule</button>
            <button class="lec-btn" onclick="selectLec('lec4')">L4: Cortical Areas</button>
            <button class="lec-btn" onclick="selectLec('lec5')">L5: Ventricles & CSF</button>
            <button class="lec-btn" onclick="selectLec('lec6')">L6: Spinal Cord Pathways</button>
            <button class="lec-btn" onclick="selectLec('lec7')">L7: Brainstem Anatomical Nuclei</button>
            <button class="lec-btn" onclick="selectLec('lec8')">L8: Cerebellum & Lesions</button>
        </div>

        <div class="view-switcher">
            <button class="view-btn active" id="btn-summary" onclick="setMode('summary')">Summary & Notes</button>
            <button class="view-btn" id="btn-cases" onclick="setMode('cases')">Clinical Cases</button>
            <button class="view-btn" id="btn-cards" onclick="setMode('cards')">Flashcards</button>
        </div>

        <div id="content-area"></div>
    </main>

    <script>
        const nss8Lectures = {
            lec1: {
                title: "L1: White Matter of Cerebrum",
                summary: [
                    "<b>Association Fibers:</b> Interconnect gyri within the same hemisphere. Short (Arcuate) connect adjacent gyri. Long include Uncinate, Cingulum, Superior/Inferior Longitudinal, and Fronto-occipital fasciculi.",
                    "<b>Commissural Fibers:</b> Connect corresponding areas of left and right hemispheres (Corpus Callosum, Anterior, Posterior, Habenular, and Hippocampal commissures).",
                    "<b>Projection Fibers:</b> Connect cerebral cortex to subcortical structures (Internal Capsule)."
                ],
                cases: [
                    {
                        title: "Case 1.1: Conduction Aphasia",
                        scenario: "A 58-year-old female presents with fluent speech and normal comprehension, but cannot repeat simple phrases. Which fiber tract is damaged?",
                        options: [
                            { text: "Uncinate Fasciculus", correct: false },
                            { text: "Arcuate Fasciculus (Superior Longitudinal)", correct: true },
                            { text: "Corpus Callosum", correct: false }
                        ],
                        explanation: "Arcuate fasciculus connects Wernicke's and Broca's areas. Damage causes repetition deficits."
                    },
                    {
                        title: "Case 1.2: Alexia Without Agraphia",
                        scenario: "A patient can write sentences voluntarily but cannot read what they wrote. MRI shows left PCA infarction involving the posterior corpus callosum.",
                        options: [
                            { text: "Rostrum", correct: false },
                            { text: "Splenium of Corpus Callosum", correct: true },
                            { text: "Genu", correct: false }
                        ],
                        explanation: "Splenium transfers visual information to the language center in the dominant hemisphere."
                    },
                    {
                        title: "Case 1.3: Personality Changes & Disconnection",
                        scenario: "Inappropriate social behavior and memory deficits following disruption of fibers connecting orbital gyri to the temporal pole.",
                        options: [
                            { text: "Uncinate Fasciculus", correct: true },
                            { text: "Cingulum", correct: false },
                            { text: "Inferior Longitudinal Fasciculus", correct: false }
                        ],
                        explanation: "Uncinate fasciculus connects the limbic temporal pole to the prefrontal orbital cortex."
                    }
                ],
                cards: [
                    { front: "Short association fibers connect?", back: "Adjacent gyri in the same hemisphere." },
                    { front: "Largest commissure in the brain?", back: "Corpus Callosum (~100 million fibers)." }
                ]
            },
            lec2: {
                title: "L2: Basal Nuclei & Ganglia",
                summary: [
                    "<b>Subcortical Ganglia:</b> Caudate Nucleus, Putamen, Globus Pallidus, Subthalamic Nucleus, Substantia Nigra.",
                    "<b>Direct Pathway:</b> Promotes voluntary movement by disinhibiting the motor thalamus.",
                    "<b>Indirect Pathway:</b> Inhibits motor movement by increasing thalamic inhibition."
                ],
                cases: [
                    {
                        title: "Case 2.1: Parkinsonian Tremor",
                        scenario: "A 66-year-old male exhibits resting tremor, cogwheel rigidity, and bradykinesia due to degeneration of midbrain neurons.",
                        options: [
                            { text: "Substantia Nigra Pars Compacta", correct: true },
                            { text: "Caudate Nucleus", correct: false },
                            { text: "Subthalamic Nucleus", correct: false }
                        ],
                        explanation: "Loss of dopaminergic neurons in Substantia Nigra causes Parkinson's disease."
                    },
                    {
                        title: "Case 2.2: Violent Flinging Movement",
                        scenario: "Sudden onset of non-rhythmic, violent flinging movements of the right limbs following a subcortical stroke.",
                        options: [
                            { text: "Contralateral Subthalamic Nucleus", correct: true },
                            { text: "Ipsilateral Putamen", correct: false },
                            { text: "Globus Pallidus Externus", correct: false }
                        ],
                        explanation: "Subthalamic nucleus damage leads to Hemiballismus."
                    },
                    {
                        title: "Case 2.3: Choreiform Movements",
                        scenario: "Involuntary jerky movements, emotional lability, and atrophy of the lateral ventricular walls.",
                        options: [
                            { text: "Caudate Nucleus & Putamen Atrophy", correct: true },
                            { text: "Subthalamic Nucleus Necrosis", correct: false },
                            { text: "Cerebellar Atrophy", correct: false }
                        ],
                        explanation: "Huntington's Disease causes degeneration of striatal GABAergic neurons."
                    }
                ],
                cards: [
                    { front: "What forms the Lentiform Nucleus?", back: "Putamen + Globus Pallidus." },
                    { front: "Hemiballismus lesion site?", back: "Contralateral Subthalamic Nucleus." }
                ]
            },
            lec3: {
                title: "L3: Internal Capsule",
                summary: [
                    "<b>Anatomy:</b> V-shaped white matter bundle with Anterior Limb, Genu, Posterior Limb, Retrolentiform & Sublentiform parts.",
                    "<b>Genu:</b> Contains Corticobulbar fibers.",
                    "<b>Posterior Limb:</b> Contains Corticospinal tract and thalamocortical sensory fibers."
                ],
                cases: [
                    {
                        title: "Case 3.1: Dense Pure Motor Stroke",
                        scenario: "Paralysis of left lower face, arm, and leg with no sensory or visual deficits.",
                        options: [
                            { text: "Right Genu & Posterior Limb", correct: true },
                            { text: "Left Anterior Limb", correct: false },
                            { text: "Retrolentiform Part", correct: false }
                        ],
                        explanation: "Lacunar infarction of genu (corticobulbar) and posterior limb (corticospinal)."
                    },
                    {
                        title: "Case 3.2: Homonymous Hemianopia",
                        scenario: "Loss of vision in the contralateral hemifield following deep cerebral hemorrhage.",
                        options: [
                            { text: "Retrolentiform Part", correct: true },
                            { text: "Anterior Limb", correct: false },
                            { text: "Sublentiform Part", correct: false }
                        ],
                        explanation: "Retrolentiform part carries optic radiation from LGB to visual cortex."
                    },
                    {
                        title: "Case 3.3: Auditory Radiation Disruption",
                        scenario: "Localized deep temporal lesion involving auditory connections from MGB to cortex.",
                        options: [
                            { text: "Sublentiform Part", correct: true },
                            { text: "Genu", correct: false },
                            { text: "Anterior Limb", correct: false }
                        ],
                        explanation: "Sublentiform part carries auditory radiation underneath the lentiform nucleus."
                    }
                ],
                cards: [
                    { front: "Fibers passing through the Genu?", back: "Corticobulbar (Corticonuclear) fibers." },
                    { front: "Artery supplying internal capsule prone to rupture?", back: "Lenticulostriate branches of MCA." }
                ]
            },
            lec4: {
                title: "L4: Functional Cortical Areas",
                summary: [
                    "<b>Frontal Lobe:</b> Area 4 (Primary Motor), Area 6 (Premotor), Area 8 (Frontal Eye Field), Areas 44/45 (Broca's).",
                    "<b>Parietal Lobe:</b> Areas 3, 1, 2 (Primary Somatosensory).",
                    "<b>Temporal Lobe:</b> Areas 41/42 (Primary Auditory), Area 22 (Wernicke's).",
                    "<b>Occipital Lobe:</b> Area 17 (Primary Visual)."
                ],
                cases: [
                    {
                        title: "Case 4.1: Expressive Speech Deficit",
                        scenario: "Non-fluent speech, telegraphic phrasing, intact comprehension, severe frustration.",
                        options: [
                            { text: "Broca's Area (Areas 44, 45)", correct: true },
                            { text: "Wernicke's Area (Area 22)", correct: false },
                            { text: "Primary Motor Area 4", correct: false }
                        ],
                        explanation: "Broca's expressive aphasia involves the left inferior frontal gyrus."
                    },
                    {
                        title: "Case 4.2: Receptive Language Impairment",
                        scenario: "Fluent speech filled with neologisms, complete lack of language comprehension.",
                        options: [
                            { text: "Wernicke's Area (Area 22)", correct: true },
                            { text: "Broca's Area", correct: false },
                            { text: "Postcentral Gyrus", correct: false }
                        ],
                        explanation: "Wernicke's receptive aphasia involves the posterior superior temporal gyrus."
                    },
                    {
                        title: "Case 4.3: Contralateral Hemineglect",
                        scenario: "Ignoring left side of body and environment following stroke in non-dominant cortex.",
                        options: [
                            { text: "Right Parietal Lobe (Areas 5, 7)", correct: true },
                            { text: "Left Frontal Lobe", correct: false },
                            { text: "Occipital Pole", correct: false }
                        ],
                        explanation: "Non-dominant parietal lobe mediates spatial attention to contralateral side."
                    }
                ],
                cards: [
                    { front: "Brodmann Area 17 location?", back: "Walls of the Calcarine Sulcus (Primary Visual Cortex)." },
                    { front: "Frontal Eye Field location?", back: "Brodmann Area 8 (controls voluntary conjugate eye movements)." }
                ]
            },
            lec5: {
                title: "L5: Ventricular System & CSF",
                summary: [
                    "<b>Ventricular Anatomy:</b> Lateral Ventricles -> Foramen of Monro -> 3rd Ventricle -> Aqueduct of Sylvius -> 4th Ventricle -> Foramina of Luschka & Magendie -> Subarachnoid Space.",
                    "<b>CSF Absorption:</b> Reabsorbed into venous circulation via Arachnoid Granulations into Superior Sagittal Sinus."
                ],
                cases: [
                    {
                        title: "Case 5.1: Infant Hydrocephalus",
                        scenario: "Dilation of lateral and 3rd ventricles with normal 4th ventricle size.",
                        options: [
                            { text: "Aqueductal Stenosis", correct: true },
                            { text: "Foramen of Monro Block", correct: false },
                            { text: "Arachnoid Granulation Atrophy", correct: false }
                        ],
                        explanation: "Blockage at Aqueduct of Sylvius causes upstream non-communicating hydrocephalus."
                    },
                    {
                        title: "Case 5.2: Post-Hemorrhage Hydrocephalus",
                        scenario: "Normal Pressure Hydrocephalus weeks after subarachnoid hemorrhage.",
                        options: [
                            { text: "Arachnoid Granulation Fibrosis", correct: true },
                            { text: "Aqueductal Obstruction", correct: false },
                            { text: "Choroid Plexus Adenoma", correct: false }
                        ],
                        explanation: "Subarachnoid blood clogs arachnoid granulations, impairing CSF absorption."
                    },
                    {
                        title: "Case 5.3: Post-LP Headache",
                        scenario: "Severe positional headache worsening when upright and improving flat.",
                        options: [
                            { text: "Low CSF Pressure Leak", correct: true },
                            { text: "Bacterial Meningitis", correct: false },
                            { text: "Venous Sinus Thrombosis", correct: false }
                        ],
                        explanation: "Persistent CSF leak causes intracranial hypotension and traction headache."
                    }
                ],
                cards: [
                    { front: "Connection between Lateral and 3rd Ventricles?", back: "Interventricular Foramen of Monro." },
                    { front: "Median aperture of 4th ventricle?", back: "Foramen of Magendie." }
                ]
            },
            lec6: {
                title: "L6: Spinal Cord Tracts & Lesions",
                summary: [
                    "<b>Ascending Pathways:</b> Dorsal Column (Fine touch, proprioception, vibration) & Spinothalamic Tract (Pain and temperature).",
                    "<b>Descending Pathways:</b> Lateral Corticospinal Tract (Voluntary motor control)."
                ],
                cases: [
                    {
                        title: "Case 6.1: Brown-Séquard Syndrome",
                        scenario: "Hemisection of spinal cord showing ipsilateral motor loss and contralateral pain/temperature loss.",
                        options: [
                            { text: "Brown-Séquard Hemisection", correct: true },
                            { text: "Syringomyelia", correct: false },
                            { text: "Tabes Dorsalis", correct: false }
                        ],
                        explanation: "Lateral corticospinal crosses high (ipsilateral motor loss), spinothalamic crosses low (contralateral pain loss)."
                    },
                    {
                        title: "Case 6.2: Syringomyelia",
                        scenario: "Cape-like loss of pain and temperature sensation across shoulders with preserved fine touch.",
                        options: [
                            { text: "Anterior White Commissure Lesion", correct: true },
                            { text: "Dorsal Column Degeneration", correct: false },
                            { text: "Lateral Column Infarction", correct: false }
                        ],
                        explanation: "Expanding central cavity disrupts decussating spinothalamic fibers."
                    },
                    {
                        title: "Case 6.3: Vitamin B12 Subacute Combined Degeneration",
                        scenario: "Loss of vibration sense, spastic paraparesis, and positive Babinski sign bilaterally.",
                        options: [
                            { text: "Dorsal & Lateral Columns", correct: true },
                            { text: "Anterior Horns Only", correct: false },
                            { text: "Spinothalamic Tracts Only", correct: false }
                        ],
                        explanation: "Subacute combined degeneration affects posterior and lateral columns."
                    }
                ],
                cards: [
                    { front: "Dorsal column modalities?", back: "Fine touch, conscious proprioception, vibration." },
                    { front: "Spinothalamic crossing site?", back: "Anterior White Commissure at spinal segment level." }
                ]
            },
            lec7: {
                title: "L7: Brainstem Nuclei & Syndromes",
                summary: [
                    "<b>Midbrain:</b> Weber's & Parinaud's Syndromes.",
                    "<b>Pons:</b> Abducens/Facial nerve nuclei, Medial Pontine Syndrome.",
                    "<b>Medulla:</b> Wallenberg's (Lateral Medullary) Syndrome."
                ],
                cases: [
                    {
                        title: "Case 7.1: Wallenberg Syndrome",
                        scenario: "Ipsilateral Horner syndrome, facial pain loss, ataxia, contralateral body pain loss.",
                        options: [
                            { text: "PICA Occlusion (Lateral Medulla)", correct: true },
                            { text: "Anterior Spinal Artery Occlusion", correct: false },
                            { text: "PCA Stroke", correct: false }
                        ],
                        explanation: "PICA infarction causes Lateral Medullary (Wallenberg) syndrome."
                    },
                    {
                        title: "Case 7.2: Weber Syndrome",
                        scenario: "Ipsilateral oculomotor palsy (CN III) with contralateral hemiparesis.",
                        options: [
                            { text: "Ventral Midbrain (Crus Cerebri)", correct: true },
                            { text: "Lateral Medulla", correct: false },
                            { text: "Dorsal Pons", correct: false }
                        ],
                        explanation: "Weber syndrome affects CN III fascicles and corticospinal fibers in crus cerebri."
                    },
                    {
                        title: "Case 7.3: Medial Medullary Syndrome",
                        scenario: "Ipsilateral tongue deviation with contralateral hemiparesis and dorsal column loss.",
                        options: [
                            { text: "Anterior Spinal Artery Occlusion", correct: true },
                            { text: "PICA Stroke", correct: false },
                            { text: "AICA Stroke", correct: false }
                        ],
                        explanation: "Anterior spinal artery supplies medial medulla (CN XII nucleus, pyramid, medial lemniscus)."
                    }
                ],
                cards: [
                    { front: "Artery involved in Wallenberg Syndrome?", back: "Posterior Inferior Cerebellar Artery (PICA)." },
                    { front: "Weber Syndrome lesion location?", back: "Anteromedial Midbrain (Crus Cerebri)." }
                ]
            },
            lec8: {
                title: "L8: Cerebellum Anatomy & Lesions",
                summary: [
                    "<b>Subdivisions:</b> Archicerebellum (Vestibulocerebellum), Paleocerebellum (Spinocerebellum), Neocerebellum (Cerebrocerebellum).",
                    "<b>Deep Nuclei:</b> Fastigial, Globose, Emboliform, Dentate.",
                    "<b>Clinical Lesions:</b> Ipsilateral intention tremor, dysmetria, ataxia, adiadochokinesia."
                ],
                cases: [
                    {
                        title: "Case 8.1: Cerebellar Hemisphere Stroke",
                        scenario: "Right-sided intention tremor, past-pointing (dysmetria), and rapid alternate movement failure.",
                        options: [
                            { text: "Right Cerebellar Hemisphere", correct: true },
                            { text: "Left Cerebellar Hemisphere", correct: false },
                            { text: "Cerebellar Vermis", correct: false }
                        ],
                        explanation: "Cerebellar hemisphere lesions cause ipsilateral limb ataxia and intention tremor."
                    },
                    {
                        title: "Case 8.2: Midline Vermis Tumor",
                        scenario: "Child presenting with severe truncal ataxia, wide-based gait, but normal limb coordination.",
                        options: [
                            { text: "Cerebellar Vermis (Medulloblastoma)", correct: true },
                            { text: "Dentate Nucleus", correct: false },
                            { text: "Flocculonodular Lobe", correct: false }
                        ],
                        explanation: "Vermis lesions cause central truncal ataxia rather than appendicular limb ataxia."
                    },
                    {
                        title: "Case 8.3: Vestibulocerebellar Lesion",
                        scenario: "Nystagmus, vertigo, loss of equilibrium with inability to maintain balance.",
                        options: [
                            { text: "Flocculonodular Lobe", correct: true },
                            { text: "Anterior Lobe", correct: false },
                            { text: "Dentate Nucleus", correct: false }
                        ],
                        explanation: "Flocculonodular lobe (Vestibulocerebellum) controls eye movements and vestibular balance."
                    }
                ],
                cards: [
                    { front: "Are cerebellar signs ipsilateral or contralateral?", back: "Ipsilateral to the side of the lesion." },
                    { front: "Deepest and largest cerebellar nucleus?", back: "Dentate Nucleus." }
                ]
            }
        };

        let currentLecKey = 'lec1';
        let currentDisplayMode = 'summary';

        function selectLec(key) {
            currentLecKey = key;
            document.querySelectorAll('.lec-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderView();
        }

        function setMode(mode) {
            currentDisplayMode = mode;
            document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
            renderView();
        }

        function switchView(view) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');
            if (view === 'study') setMode('summary');
            if (view === 'cases') setMode('cases');
            if (view === 'flashcards') setMode('cards');
        }

        function verifyAnswer(btn, isCorrect) {
            const parent = btn.parentElement;
            parent.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
            if (isCorrect) btn.classList.add('correct');
            else btn.classList.add('incorrect');
            parent.parentElement.querySelector('.explanation').style.display = 'block';
        }

        function renderView() {
            const container = document.getElementById('content-area');
            const lecData = nss8Lectures[currentLecKey];

            if (currentDisplayMode === 'summary') {
                container.innerHTML = `
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">${lecData.title}</span>
                            <span class="badge">Notes</span>
                        </div>
                        <ul style="padding-left: 20px; line-height: 1.8;">
                            ${lecData.summary.map(item => `<li style="margin-bottom: 12px;">${item}</li>`).join('')}
                        </ul>
                    </div>
                `;
            } else if (currentDisplayMode === 'cases') {
                container.innerHTML = lecData.cases.map((c) => `
                    <div class="card">
                        <div class="case-box">
                            <div class="case-title"><i class="fa-solid fa-stethoscope"></i> ${c.title}</div>
                            <p style="font-size: 14px; color: var(--text-secondary); line-height: 1.6;">${c.scenario}</p>
                        </div>
                        <div class="options-list">
                            ${c.options.map(opt => `
                                <button class="option-btn" onclick="verifyAnswer(this, ${opt.correct})">
                                    <span>${opt.text}</span>
                                    <i class="fa-regular fa-circle"></i>
                                </button>
                            `).join('')}
                        </div>
                        <div class="explanation">
                            <b>Anatomical Explanation:</b> ${c.explanation}
                        </div>
                    </div>
                `).join('');
            } else if (currentDisplayMode === 'cards') {
                container.innerHTML = `
                    <div class="flashcard-grid">
                        ${lecData.cards.map(card => `
                            <div class="flashcard-container" onclick="this.querySelector('.flashcard').classList.toggle('flipped')">
                                <div class="flashcard">
                                    <div class="card-front">
                                        <p style="font-weight:600; font-size: 14px;">${card.front}</p>
                                        <span style="font-size:11px; color: var(--text-muted); margin-top:16px;">Click to flip</span>
                                    </div>
                                    <div class="card-back">
                                        <p style="font-weight:600; font-size: 14px;">${card.back}</p>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        }

        renderView();
    </script>
</body>
</html>
