<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hospital Shift: Neuro Ward</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8EEF1;--ink:#17303B;--card:#fff;--line:#C5D2D8;--teal:#167A78;--bad:#B93A36;--ok:#1E7A45;--mute:#58737F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10202A;--ink:#E3EEF2;--card:#19303C;--line:#2B4553;--teal:#4DBFB8;--bad:#F07A74;--ok:#6CCB92;--mute:#93AEBA}}
:root[data-theme=dark]{--bg:#10202A;--ink:#E3EEF2;--card:#19303C;--line:#2B4553;--teal:#4DBFB8;--bad:#F07A74;--ok:#6CCB92;--mute:#93AEBA}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:30px;font-weight:800;line-height:1.1;margin:8px 0 4px}h2{font-size:21px;margin:4px 0 8px}
p{margin:6px 0}.mute{color:var(--mute);font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.rep{font-weight:800;color:var(--teal)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:600;width:100%;margin-top:10px}
.btn:disabled{opacity:.4;cursor:default}.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.case{display:flex;justify-content:space-between;width:100%;text-align:left;align-items:center}
.ord{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.ord button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;font-size:14px}
.ord button.u{border-color:var(--teal);background:none;color:var(--teal)}.ord button:disabled:not(.u){opacity:.4}
.find{border-left:4px solid var(--teal);background:var(--card);padding:8px 12px;margin:8px 0;border-radius:0 10px 10px 0}
.find b{display:block;font-size:13px;color:var(--teal)}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:7px 0}
.opt.s{border:2px solid var(--teal);padding:10px 11px}.opt.ok{border:2px solid var(--ok)}.opt.no{border:2px solid var(--bad)}
.tag{font-weight:800}.good{color:var(--ok)}.badc{color:var(--bad)}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:7px 0}
summary{font-weight:600;cursor:pointer}details p{font-size:15px}
</style></head><body><div id="app"></div>
<script>
const C=[
{n:"Mr. Hamdy, 62",c:"Collapsed mid-argument. Severe headache, vomiting, then could not move his left side.",
o:[["History","Hypertensive for years, poorly treated. BP now 220/120. Headache came first, then collapse."],
["Motor exam","Left arm, left leg and the left side of the face are paralysed. Right side normal."],
["Sensory exam","Left side: pain, temperature, touch and position sense all lost, face included."],
["Vision & hearing","Visual fields full. Hearing normal both sides."],
["CT head","Fresh blood deep in the right hemisphere, wedged between the thalamus and the lentiform nucleus, reaching the bend of the V."],
["Speech & smell","Speech fluent, comprehension normal, smell normal."]],
h:"Face, arm AND leg, plus every sensory modality, all on one side. Think of the one place where motor and sensory fibres run together in a tight V.",
q1:["Where is the lesion?",["Right internal capsule: genu and posterior limb","Right internal capsule: anterior limb only","Right internal capsule: retrolentiform part","Left internal capsule: posterior limb","Right corpus callosum, body","Right caudate nucleus only"]],
q2:["Which vessel most likely bled?",["Lateral striate branch of the middle cerebral artery (Charcot's artery)","Recurrent artery of Heubner","Medial striate branch of the anterior cerebral artery","Anterior choroidal artery","Posterior communicating artery"]],
f:"Contralateral hemiplegia including the face (corticobulbar fibres in the genu + corticospinal in the posterior limb) plus loss of all somatosensation (superior thalamic radiation) points to the internal capsule opposite the deficit. The artery of cerebral haemorrhage is a lateral striate branch of the MCA."},
{n:"Mrs. Nadia, 58",c:"Two days of 'missing things' on her right. Bumps into door frames. No headache, no fall.",
o:[["History","Not clumsy with her hands. She simply does not see people approaching from the right."],
["Motor exam","Power 5/5 all four limbs. Gait normal. Face symmetrical."],
["Sensory exam","All modalities intact."],
["Visual fields","Right homonymous hemianopia."],
["Hearing","Whisper and tuning fork normal on both sides."],
["MRI","Small infarct in the left internal capsule, behind the lentiform nucleus. Thalamus and lentiform nucleus spared."]],
h:"No weakness, no sensory loss. One special sense is lost. Which part of the capsule is behind the lentiform nucleus?",
q1:["Where is the lesion?",["Left retrolentiform part of the internal capsule","Left sublentiform part of the internal capsule","Left posterior limb of the internal capsule","Left genu of the internal capsule","Right retrolentiform part of the internal capsule","Left anterior limb of the internal capsule"]],
q2:["Which fibres carry the lost function through this part?",["Optic radiation (with parieto-occipito-pontine fibres)","Auditory radiation (with temporo-pontine fibres)","Superior thalamic (sensory) radiation","Corticobulbar fibres","Frontopontine fibres"]],
f:"Retrolentiform part: optic radiation + parieto-occipito-pontine fibres. The sublentiform part (below the lentiform nucleus) carries the auditory radiation + temporo-pontine fibres, and her hearing was normal, so it is not that."},
{n:"Mr. Farouk, 70",c:"His wife says his face has gone blank and he no longer swings his arms when he walks.",
o:[["History","Months of slowly worsening stiffness. Handwriting getting smaller."],
["Gait & posture","Stooped, short shuffling steps. Arms flexed at elbows and wrists, hips and knees slightly flexed."],
["Tone & tremor","Rigid on passive movement. Hand tremor at rest, easing on purposeful movement."],
["Power","Full power in all limbs. No paralysis."],
["Sensory exam","Sensation normal throughout."],
["MRI","No haemorrhage or infarct in the internal capsule. Changes involve the deep grey masses beside the lateral ventricles."]],
h:"Rigidity, rest tremor, lost automatic movements, and NO paralysis. The pyramidal pathway is fine.",
q1:["Which structure is primarily affected?",["Basal nuclei (corpus striatum)","Posterior limb of the internal capsule","Genu of the internal capsule","Body of the corpus callosum","Corona radiata","Amygdaloid nucleus"]],
q2:["Which statement about the corpus striatum is correct?",["Caudate + putamen receive; globus pallidus is the efferent (outflow) part","Globus pallidus receives from the cortex; putamen is the outflow part","Caudate nucleus and putamen together form the lentiform nucleus","Claustrum is the outflow centre of the striatum","Amygdaloid body forms the pale medial part of the lentiform nucleus"]],
f:"Damage to the corpus striatum gives rigidity, loss of automatic associated movements (facial expression, arm swing) and resting tremor. Lentiform nucleus = putamen + globus pallidus. Striatum (caudate + putamen) is the receptive part."},
{n:"Mr. Tarek, 49",c:"Right-handed. Three days after a left hemisphere stroke: 'I understand everything, but I can't repeat what you say.'",
o:[["History","Speaks fluently and naturally. Frustrated only when asked to repeat."],
["Language testing","Fluent speech. Comprehension intact. Repetition of phrases severely impaired."],
["Motor exam","No weakness. Face symmetrical."],
["Sensory exam","Normal."],
["MRI","Small lesion in white matter arching around the posterior lateral sulcus of the left hemisphere. Both language cortices look intact."],
["Vision & smell","Visual fields full. Smell intact."]],
h:"Both language areas are intact. The wire between them is cut.",
q1:["Which bundle is damaged?",["Arcuate fasciculus (dominant hemisphere)","Uncinate fasciculus","Cingulum","Inferior longitudinal fasciculus","Anterior commissure","Fronto-occipital fasciculus"]],
q2:["What class of fibre is this?",["Short association fibre","Long association fibre","Commissural fibre","Corticofugal projection fibre","Corticopetal projection fibre"]],
f:"The arcuate fasciculus hooks around the sulcus and, in the dominant hemisphere, links the two major language areas. Lecture classification: a short (arcuate) association fibre, not a long one."},
{n:"Ms. Salma, 54",c:"Three months of headaches. Neurosurgery wants to know exactly which part of the great commissure is involved.",
o:[["History","No weakness, no seizures, no personality change."],
["Neuro exam","Power and sensation normal. No lateralising signs."],
["Sagittal MRI","Mass in the thickest end of the C-shaped band, bulging backwards."],
["Axial MRI","Tumour spreads toward both occipital poles in a pincer pattern."],
["Ventricles","Distortion of the roof and lateral wall of the posterior horns."],
["Smell & amygdala","Normal. Anterior commissure region clear."]],
h:"The thickest part of the corpus callosum is not the genu.",
q1:["Which part is involved?",["Splenium","Genu","Rostrum","Body (trunk)","Anterior commissure","Hippocampal commissure"]],
q2:["Which structures arise from this part?",["Tapetum and forceps major","Forceps minor","Floor of the anterior horns (rostrum)","Septum pellucidum and fornix","Stalk of the pineal gland"]],
f:"Splenium: thickest, posterior end. Fibres go laterally then down as the tapetum (roof and lateral wall of the posterior horn, lateral wall of the inferior horn) and backwards as the forceps major. Genu gives the forceps minor."},
{n:"Mrs. Layla, 66 (boss case)",c:"Sudden right facial droop and slurred speech. 'My tongue feels heavy.' Arms and legs feel normal.",
o:[["History","Sudden onset, no headache. Diabetic and hypertensive."],
["Motor exam","Right lower face and tongue weak. Arm and leg power normal."],
["Sensory exam","Normal, face included."],
["Vision & hearing","Normal."],
["MRI","Tiny left infarct exactly at the angle where the anterior and posterior limbs meet."],
["Angiography","Main cerebral arteries patent. Small perforator disease near the carotid terminus."]],
h:"Cranial nerve nuclei are the target here, not the limbs. Which part of the V holds the corticonuclear fibres?",
q1:["Where is the lesion?",["Left genu of the internal capsule","Right genu of the internal capsule","Left posterior limb","Left anterior limb","Left sublentiform part","Left retrolentiform part"]],
q2:["What supplies this part?",["Recurrent artery of Heubner or direct branches of the internal carotid","Lateral striate branches of the middle cerebral artery","Anterior choroidal artery","Medial striate branches of the anterior cerebral artery","Posterior cerebral artery"]],
f:"Genu: corticobulbar (corticonuclear) fibres. Blood supply: recurrent artery of Heubner or direct branches from the internal carotid. Anterior limb = medial + lateral striate; posterior limb = lateral striate + anterior choroidal."}];
const L=[["White matter: 3 types","Association (same hemisphere): short/arcuate hook around sulci; long = uncinate (orbital gyri to temporal pole), cingulum (cingulate gyrus to hippocampus), superior longitudinal (largest), fronto-occipital, inferior longitudinal. Commissural (between hemispheres): anterior, posterior, hippocampal, habenular, corpus callosum. Projection: cortex to lower centres (corticofugal) and back (corticopetal)."],
["Corpus callosum","About 10 cm, 100 million fibres, C-shaped, roof of lateral ventricle. Rostrum (floor of anterior horns), genu (forceps minor), body, splenium (thickest: tapetum + forceps major)."],
["Other commissures","Anterior: olfactory bulbs, anterior perforated substance, piriform lobes, amygdaloid bodies. Posterior: pretectal nuclei. Habenular: habenular nuclei. Hippocampal: between fornix crura."],
["Internal capsule","V-shaped bundle of projection fibres, continuous with corona radiata above and crus cerebri below. Anterior limb (between caudate head and lentiform): frontopontine + anterior thalamic radiation. Genu: corticobulbar. Posterior limb (thalamus to lentiform): corticospinal, superior thalamic radiation, corticorubral, parieto-pontine. Sublentiform: auditory radiation + temporopontine. Retrolentiform: optic radiation + parieto-occipito-pontine."],
["Arterial supply","Striate arteries from MCA and ACA. Anterior limb: medial striate (ACA) + lateral striate (MCA). Genu: recurrent artery of Heubner or ICA branches. Posterior limb: lateral striate (MCA) + anterior choroidal. Charcot's artery = a lateral striate branch of the MCA."],
["Capsule lesion","Contralateral hemiplegia including the face, plus loss of all somatosensation on the opposite side including the face."],
["Basal nuclei","Caudate (head, body, tail), lentiform (putamen + globus pallidus), amygdaloid, claustrum. Striatum = caudate + putamen (receptive); globus pallidus = efferent. Damage: rigidity, lost associated movements, resting tremor. Chorea (jerky, irregular), athetosis (slow, distal), hemiballismus (one side), Parkinsonism (tremor, rigidity, bradykinesis, stooped posture)."]];
const A=document.getElementById('app');
let S={rep:0,best:{}},G;
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const mk=q=>sh(q[1].map((t,i)=>[t,i==0]));
function home(){const done=Object.keys(S.best).length,tot=Object.values(S.best).reduce((a,b)=>a+b,0);
A.innerHTML=`<div class=bar><span class=mute>Neuro Ward, night shift</span><span class=rep>Reputation ${tot}</span></div>
<h1>Hospital Shift: Neuro Ward</h1><p class=mute>Each patient is a mystery. You get 4 orders out of 6, then one shot at the diagnosis and one at the follow-up. No timer. No lives. Just reasoning.</p>`+
C.map((c,i)=>`<button class="card case" onclick="open_(${i})"><span><b>${c.n}</b><br><span class=mute>${c.c.slice(0,70)}...</span></span><span class=tag>${S.best[i]!=null?S.best[i]+'/100':'New'}</span></button>`).join('')+
`<button class="btn ghost" onclick="lib()">Open the study library</button>`+
(done==C.length?`<div class=card><h2>Shift over: ${tot>=480?'Chief Resident':tot>=360?'Registrar':tot>=240?'Resident':'Intern, back to the library'}</h2><p class=mute>Total ${tot} of ${C.length*100}. Replay any case to beat your best.</p></div>`:'')}
function lib(){A.innerHTML=`<div class=bar><button class="btn ghost" style="width:auto;margin:0" onclick="home()">Back</button><span class=rep>Library</span></div><p class=mute>From Prof. Autifi's lecture.</p>`+L.map(x=>`<details><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('')}
function open_(i){G={i,u:[],s:1,sel:null,a1:null,a2:null,h:0,o1:mk(C[i].q1),o2:mk(C[i].q2)};view()}
function ord(k){if(G.s>2||G.u.includes(k)||G.u.length>=4)return;G.u.push(k);view()}
function hint(){G.h++;view()}
function pick(k){G['s'+G.s]=k;G.sel=k;view()}
function lock(){G['a'+G.s]=G.sel;G.sel=null;if(G.s==1){G.s=2;view()}else{G.s=3;fin()}}
function view(){const c=C[G.i],left=4-G.u.length;
let h=`<div class=bar><button class="btn ghost" style="width:auto;margin:0" onclick="home()">Leave</button><span class=mute>Orders left: <b>${left}</b></span></div><h2>${c.n}</h2><p>${c.c}</p>`;
h+=`<div class=ord>`+c.o.map((o,k)=>`<button class="${G.u.includes(k)?'u':''}" ${G.s>1||(!G.u.includes(k)&&!left)?'disabled':''} onclick="ord(${k})">${o[0]}</button>`).join('')+`</div>`;
h+=G.u.map(k=>`<div class=find><b>${c.o[k][0]}</b>${c.o[k][1]}</div>`).join('');
if(G.h)h+=`<div class=find><b>Attending (-10 reputation)</b>${c.h}</div>`;
if(G.s==1)h+=`<button class="btn ghost" onclick="hint()" ${G.h?'disabled':''}>Ask the attending for a hint (-10)</button>`;
const q=G.s==1?c.q1:c.q2,os=G.s==1?G.o1:G.o2;
h+=`<h2 style="margin-top:18px">${G.s==1?'Diagnosis: ':'Follow-up: '}${q[0]}</h2>`+os.map((o,k)=>`<button class="opt ${G.sel===k?'s':''}" onclick="pick(${k})">${o[0]}</button>`).join('')+`<button class=btn ${G.sel==null?'disabled':''} onclick="lock()">Lock in answer (final)</button>`;
A.innerHTML=h}
function fin(){const c=C[G.i],k1=G.o1[G.a1][1],k2=G.o2[G.a2][1],left=4-G.u.length;
let s=(k1?40:0)+(k2?40:0)+(k1?left*5:0)-G.h*10;s=Math.max(0,s);
if(S.best[G.i]==null||s>S.best[G.i])S.best[G.i]=s;
const rv=(os,a)=>os.map((o,k)=>`<div class="opt ${o[1]?'ok':k==a?'no':''}" style="${o[1]||k==a?'':'opacity:.55'}">${o[0]}${o[1]?' &#10003;':k==a?' &#10007; your answer':''}</div>`).join('');
const miss=c.o.map((o,k)=>G.u.includes(k)?'':`<div class=find><b>${o[0]} (not ordered)</b>${o[1]}</div>`).join('');
A.innerHTML=`<h1>${s} / 100</h1><p class="tag ${k1&&k2?'good':'badc'}">${k1&&k2?'Case solved.':k1?'Right place, wrong follow-up.':'Missed diagnosis.'}</p>
<h2>Diagnosis</h2>${rv(G.o1,G.a1)}<h2>Follow-up</h2>${rv(G.o2,G.a2)}
<div class=card><b>Case file</b><p>${c.f}</p></div>${miss?'<h2>What you skipped</h2>'+miss:''}
<button class=btn onclick="open_(${G.i})">Replay this case</button><button class="btn ghost" onclick="home()">Back to the ward</button>`}
home();
</script></body></html>
